<!-- OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{

 id="foto"

 accept="image/*"

TXT Alloggiati Web

</button>

CSV Tassa di soggiorno Taranto

<script>

const STORAGE_KEY="bb_manager_taranto_ospiti";

let ospiti=JSON.parse(
  localStorage.getItem(STORAGE_KEY) || "[]"
);


/* =========================
   VISUALIZZA OSPITI
========================= */

function mostraOspiti(){

  const lista=document.getElementById("lista");

  if(!ospiti.length){
    lista.innerHTML="<p>Nessun ospite.</p>";
    return;
  }

  lista.innerHTML=ospiti.map((x,i)=>`

    <div class="ospite">

      <b>${escapeHtml(x.cognome)} ${escapeHtml(x.nome)}</b>

      <br>
      Documento: ${escapeHtml(x.documento)}

      <br>
      Arrivo: ${escapeHtml(x.arrivo || "")}

      <br>
      Partenza: ${escapeHtml(x.partenza || "")}

    </div>

  `).join("");
}


/* =========================
   SALVA OSPITE
========================= */

function salvaOspite(){

  const cognome=document.getElementById("cognome").value.trim();
  const nome=document.getElementById("nome").value.trim();
  const documento=document.getElementById("documento").value.trim();
  const tipoDocumento=document.getElementById("tipoDocumento").value;
  const nazionalita=document.getElementById("nazionalita").value;
  const arrivo=document.getElementById("arrivo").value;
  const partenza=document.getElementById("partenza").value;

  if(!cognome || !nome || !documento){

    alert("Inserisci almeno Cognome, Nome e Numero documento.");

    return;
  }

  ospiti.push({
    cognome,
    nome,
    documento,
    tipoDocumento,
    nazionalita,
    arrivo,
    partenza
  });

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(ospiti)
  );

  mostraOspiti();

  document.getElementById("cognome").value="";
  document.getElementById("nome").value="";
  document.getElementById("documento").value="";

  alert("Ospite salvato.");
}


/* =========================
   OCR DOCUMENTO
========================= */

async function elaboraDocumento(event){

  const file=event.target.files[0];

  if(!file) return;

  const anteprima=document.getElementById("anteprima");
  const stato=document.getElementById("statoOCR");

  /* Mostra subito la fotografia */

  const url=URL.createObjectURL(file);

  anteprima.src=url;
  anteprima.style.display="block";

  stato.innerHTML="📷 Foto acquisita.<br>🔎 Avvio riconoscimento testo...";

  try{

    /*
      Usiamo Tesseract OCR.
      La CIE italiana contiene testo principalmente
      in caratteri latini, quindi ita+eng aiuta
      il riconoscimento.
    */

    const worker=await Tesseract.createWorker(
      "ita+eng",
      1,
      {
        logger:function(m){

          if(m.status){

            const percent=
              m.progress
              ? Math.round(m.progress*100)
              : "";

            stato.innerHTML=
              "🔎 "+m.status+
              (percent!=="" ? " "+percent+"%" : "");

          }

        }
      }
    );

    const risultato=
      await worker.recognize(file);

    const testo=
      risultato.data.text || "";

    await worker.terminate();

    console.log("TESTO OCR:",testo);

    stato.innerHTML=
      "✅ OCR completato.<br>"+
      "Analizzo i dati del documento...";

    estraiDatiCIE(testo);

  }catch(errore){

    console.error(errore);

    stato.innerHTML=
      "❌ Errore durante il riconoscimento OCR.<br>"+
      "Prova a fotografare nuovamente il documento con buona luce.";

  }

}


/* =========================
   ESTRAZIONE DATI CIE
========================= */

function estraiDatiCIE(testo){

  /*
    Normalizziamo il testo.
  */

  let righe=testo
    .replace(/\r/g,"\n")
    .split("\n")
    .map(x=>x.trim())
    .filter(Boolean);

  console.log("RIGHE OCR:",righe);


  /*
    NUMERO DOCUMENTO

    Una CIE italiana normalmente contiene
    una sequenza alfanumerica simile a:

    CA07404HJ

    Cerchiamo sequenze di 9 caratteri.
  */

  let documento="";

  const testoPulito=
    testo
      .toUpperCase()
      .replace(/[^A-Z0-9\n ]/g," ");

  const candidati=
    testoPulito.match(
      /\b[A-Z]{2}[A-Z0-9]{7}\b/g
    ) || [];

  if(candidati.length){

    documento=candidati[0];

  }


  /*
    Se OCR ha letto male qualche carattere,
    cerchiamo anche stringhe alfanumeriche.
  */

  if(!documento){

    const alternativi=
      testoPulito.match(
        /\b[A-Z0-9]{8,10}\b/g
      ) || [];

    for(const c of alternativi){

      if(
        /[A-Z]/.test(c) &&
        /\d/.test(c)
      ){

        documento=c;
        break;

      }

    }

  }


  /*
    COGNOME E NOME

    Cerchiamo prima le parole vicine
    alle etichette COGNOME e NOME.
  */

  let cognome="";
  let nome="";

  for(let i=0;i<righe.length;i++){

    const r=
      righe[i]
        .toUpperCase()
        .replace(/\s+/g," ");

    if(
      !cognome &&
      r.includes("COGNOME")
    ){

      const dopo=
        righe[i]
          .replace(/.*COGNOME\s*[:\-]?\s*/i,"")
          .trim();

      if(
        dopo &&
        !/COGNOME/i.test(dopo)
      ){

        cognome=pulisciNome(dopo);

      }else if(righe[i+1]){

        cognome=
          pulisciNome(righe[i+1]);

      }

    }

  }


  /*
    Seconda ricerca per NOME.
  */

  for(let i=0;i<righe.length;i++){

    const r=
      righe[i]
        .toUpperCase()
        .replace(/\s+/g," ");

    if(
      !nome &&
      /\bNOME\b/.test(r)
    ){

      const dopo=
        righe[i]
          .replace(/.*\bNOME\b\s*[:\-]?\s*/i,"")
          .trim();

      if(
        dopo &&
        !/NOME/i.test(dopo)
      ){

        nome=pulisciNome(dopo);

      }else if(righe[i+1]){

        nome=
          pulisciNome(righe[i+1]);

      }

    }

  }


  /*
    Metodo aggiuntivo:
    se l'OCR restituisce una riga del tipo:

    COGNOME / SURNAME
    COGNOME
    NOME / NAME
    DOMENICO

    prendiamo le righe successive.
  */

  if(!cognome){

    for(let i=0;i<righe.length;i++){

      if(
        /COGNOME|SURNAME/i.test(righe[i])
        &&
        righe[i+1]
      ){

        const possibile=
          pulisciNome(righe[i+1]);

        if(
          possibile &&
          possibile.length>1
        ){

          cognome=possibile;
          break;

        }

      }

    }

  }


  if(!nome){

    for(let i=0;i<righe.length;i++){

      if(
        /\bNOME\b|\bNAME\b/i.test(righe[i])
        &&
        righe[i+1]
      ){

        const possibile=
          pulisciNome(righe[i+1]);

        if(
          possibile &&
          possibile.length>1
        ){

          nome=possibile;
          break;

        }

      }

    }

  }


  /*
    Inseriamo i risultati nei campi.
  */

  if(cognome){

    document.getElementById("cognome").value=
      cognome;

  }

  if(nome){

    document.getElementById("nome").value=
      nome;

  }

  if(documento){

    document.getElementById("documento").value=
      documento;

  }


  /*
    Tipo documento.
  */

  if(
    document.getElementById("tipoDocumento")
  ){

    document.getElementById("tipoDocumento").value=
      "CI";

  }


  const stato=
    document.getElementById("statoOCR");


  if(cognome || nome || documento){

    stato.innerHTML=
      "✅ Dati riconosciuti.<br>"+
      "Controlla i campi prima di salvare.";

  }else{

    stato.innerHTML=
      "⚠️ Foto letta, ma non sono riuscito "+
      "a riconoscere automaticamente i dati.<br>"+
      "Prova una foto più ravvicinata e luminosa.";

  }

}


/* =========================
   PULIZIA NOMI
========================= */

function pulisciNome(testo){

  return testo
    .replace(
      /[^A-Za-zÀ-ÖØ-öø-ÿ' -]/g,
      ""
    )
    .replace(/\s+/g," ")
    .trim()
    .toUpperCase();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(testo){

  return String(testo || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   DOWNLOAD FILE
========================= */

function scarica(nome,contenuto,tipo){

  const blob=
    new Blob(
      [contenuto],
      {type:tipo}
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement("a");

  a.href=url;
  a.download=nome;

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

}


/* =========================
   ALLOGGIATI WEB
========================= */

function esportaAlloggiati(){

  if(!ospiti.length){

    alert("Nessun ospite.");
    return;

  }

  const righe=
    ospiti.map(x=>
      [
        x.cognome,
        x.nome,
        x.documento,
        x.arrivo,
        x.partenza
      ].join(";")
    );

  scarica(
    "alloggiati_web.txt",
    righe.join("\n"),
    "text/plain"
  );

}
