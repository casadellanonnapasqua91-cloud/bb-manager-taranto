<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2f80ed"><link rel="manifest" href="manifest.json"><title>B&B Manager Taranto</title><style>body{font-family:Arial;margin:0;background:#f4f6f8}header{background:#2f80ed;color:white;padding:18px}main{padding:16px;max-width:700px;margin:auto}.card{background:white;padding:16px;margin:12px 0;border-radius:14px}input,button{width:100%;box-sizing:border-box;padding:12px;margin:5px 0;border-radius:8px}button{background:#2f80ed;color:white;border:0}</style></head><body><header><h1>B&B Manager Taranto</h1></header><main><div class="card"><h2>Nuovo ospite</h2><input id="cognome" placeholder="Cognome"><input id="nome" placeholder="Nome"><input id="documento" placeholder="Numero documento"><input id="arrivo" type="date"><input id="partenza" type="date"><button onclick="salva()">Salva ospite</button><button onclick="document.getElementById('foto').click()">📷 Foto documento</button><input id="foto" type="file" accept="image/*" capture="environment" hidden></div><div class="card"><h2>Esportazioni</h2><button onclick="exp('alloggiati')">TXT Alloggiati Web</button><button onclick="exp('spot')">XML SPOT Puglia</button><button onclick="exp('taranto')">File Tassa di soggiorno Taranto</button></div><div class="card"><h2>Ospiti</h2><div id="lista"></div></div></main><script>const K='bbm';function A(){return JSON.parse(localStorage.getItem(K)||'[]')}function R(){lista.innerHTML=A().map(x=>`<p><b>${x.cognome} ${x.nome}</b><br>${x.documento||''}<br>${x.arrivo||''} → ${x.partenza||''}</p>`).join('')||'Nessun ospite.'}function salva(){let x={cognome:cognome.value,nome:nome.value,documento:documento.value,arrivo:arrivo.value,partenza:partenza.value};if(!x.cognome||!x.nome)return alert('Inserisci nome e cognome');let a=A();a.push(x);localStorage.setItem(K,JSON.stringify(a));R()}function dl(n,t,type){let u=URL.createObjectURL(new Blob([t],{type})),a=document.createElement('a');a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}function exp(k){let a=A();if(!a.length)return alert('Nessun ospite');if(k==='alloggiati')dl('alloggiati.txt',a.map(x=>[x.cognome,x.nome,x.documento,x.arrivo,x.partenza].join(';')).join('\n'),'text/plain');if(k==='spot')dl('spot.xml','<?xml version="1.0"?><ospiti>'+a.map(x=>`<ospite><cognome>${x.cognome}</cognome><nome>${x.nome}</nome><documento>${x.documento||''}</documento><arrivo>${x.arrivo||''}</arrivo><partenza>${x.partenza||''}</partenza></ospite>`).join('')+'</ospiti>','application/xml');if(k==='taranto')dl('tassa_soggiorno_taranto.csv','Cognome;Nome;Documento;Arrivo;Partenza\n'+a.map(x=>[x.cognome,x.nome,x.documento,x.arrivo,x.partenza].join(';')).join('\n'),'text/csv')}R();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')</script></body></html>
