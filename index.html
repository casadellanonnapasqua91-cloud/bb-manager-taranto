<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2f80ed">

<title>B&B Manager Taranto</title>

<!-- OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

header {
    background: #2f80ed;
    color: white;
    padding: 22px 16px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 8px 0 0;
}

main {
    max-width: 760px;
    margin: auto;
    padding: 16px;
}

.card {
    background: white;
    padding: 18px;
    margin: 12px 0;
    border-radius: 16px;
    box-shadow: 0 2px 10px #0001;
}

h2 {
    margin-top: 0;
}

input,
select,
button {
    width: 100%;
    padding: 13px;
    margin: 6px 0;
    border-radius: 9px;
    border: 1px solid #ccc;
    font-size: 16px;
}

button {
    background: #2f80ed;
    color: white;
    border: 0;
    font-weight: bold;
    cursor: pointer;
}

button.secondary {
    background: #555;
}

button.green {
    background: #219653;
}

button.orange {
    background: #f2994a;
}

button.red {
    background: #eb5757;
}

#anteprima {
    width: 100%;
    max-height: 350px;
    object-fit: contain;
    margin-top: 10px;
    border-radius: 10px;
    display: none;
}

#statoOCR {
    display: none;
    margin-top: 10px;
    padding: 12px;
    border-radius: 10px;
    background: #eef4ff;
}

#testoOCR {
    width: 100%;
    min-height: 120px;
    display: none;
    margin-top: 10px;
    padding: 10px;
}

.ospite {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 12px;
    margin: 8px 0;
    background: #fafafa;
}

.small {
    font-size: 13px;
    color: #666;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

@media (max-width: 600px) {
    .row {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>B&B Manager Taranto</h1>
    <p>Gestione ospiti</p>
</header>

<main>

<div class="card">

<h2>Nuovo ospite</h2>

<input
    id="cognome"
    type="text"
    placeholder="Cognome"
>

<input
    id="nome"
    type="text"
    placeholder="Nome"
>

<input
    id="documento"
    type="text"
    placeholder="Numero documento"
>

<div class="row">

<input
    id="arrivo"
    type="date"
>

<input
    id="partenza"
    type="date"
>

</div>

<select id="tipoDocumento">
    <option value="">Tipo documento</option>
    <option value="CARTA_IDENTITA">Carta d'identità</option>
    <option value="PASSAPORTO">Passaporto</option>
    <option value="PATENTE">Patente</option>
    <option value="ALTRO">Altro</option>
</select>

<select id="nazionalita">
    <option value="">Nazionalità</option>
    <option value="ITA">Italia</option>
    <option value="FRA">Francia</option>
    <option value="DEU">Germania</option>
    <option value="ESP">Spagna</option>
    <option value="GBR">Regno Unito</option>
    <option value="USA">Stati Uniti</option>
    <option value="ALTRO">Altra</option>
</select>

<button
    type="button"
    onclick="apriFotocamera()"
>
    📷 Fotografa documento
</button>

<input
    id="foto"
    type="file"
    accept="image/*"
    capture="environment"
    style="display:none"
    onchange="leggiDocumento(event)"
>

<img id="anteprima">

<div id="statoOCR">
    🔎 <b>Sto leggendo il documento...</b>
    <br>
    <span id="percentualeOCR">Attendere qualche secondo.</span>
</div>

<textarea
    id="testoOCR"
    placeholder="Testo riconosciuto"
></textarea>

<button
    type="button"
    class="green"
    onclick="salvaOspite()"
>
    Salva ospite
</button>

</div>


<div class="card">

<h2>Esportazioni</h2>

<button
    type="button"
    onclick="esportaAlloggiati()"
>
    📄 Alloggiati Web
</button>

<button
    type="button"
    onclick="esportaSPOT()"
>
    📄 XML SPOT Puglia
</button>

<button
    type="button"
    onclick="esportaTassa()"
>
    📄 Tassa di soggiorno Taranto
</button>

</div>


<div class="card">

<h2>Ospiti registrati</h2>

<div id="lista"></div>

</div>

</main>


<script>

const CHIAVE = "bb_manager_taranto_ospiti";

let fotoCorrente = null;


/* =========================
   AVVIO
========================= */

document.addEventListener("DOMContentLoaded", function() {

    const oggi = new Date();

    const data =
        oggi.getFullYear() +
        "-" +
        String(oggi.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(oggi.getDate()).padStart(2, "0");

    document.getElementById("arrivo").value = data;

    mostraOspiti();

});


/* =========================
   FOTOCAMERA
========================= */

function apriFotocamera() {

    document.getElementById("foto").click();

}


/* =========================
   FOTO + OCR
========================= */

async function leggiDocumento(event) {

    const file = event.target.files[0];

    if (!file) {
        return;
    }

    fotoCorrente = file;

    /* Anteprima */

    const immagine =
        document.getElementById("anteprima");

    immagine.src =
        URL.createObjectURL(file);

    immagine.style.display = "block";


    /*
       Proviamo anche a scaricare una copia
       della fotografia.
    */

    salvaFotoSulTelefono(file);


    /* Mostra stato OCR */

    document.getElementById("statoOCR").style.display =
        "block";

    document.getElementById("testoOCR").style.display =
        "none";

    document.getElementById("percentualeOCR").innerText =
        "Avvio lettura...";


    try {

        const risultato =
            await Tesseract.recognize(
                file,
                "ita",
                {
                    logger: function(info) {

                        if (info.status === "recognizing text") {

                            const percentuale =
                                Math.round(
                                    info.progress * 100
                                );

                            document.getElementById(
                                "percentualeOCR"
                            ).innerText =
                                "Lettura: " +
                                percentuale +
                                "%";

                        }

                    }
                }
            );


        const testo =
            risultato.data.text || "";


        document.getElementById("testoOCR").value =
            testo;

        document.getElementById("testoOCR").style.display =
            "block";


        estraiDatiDocumento(testo);


        document.getElementById(
            "percentualeOCR"
        ).innerText =
            "Lettura completata. Controlla i dati.";


    } catch (errore) {

        console.error(errore);

        document.getElementById(
            "percentualeOCR"
        ).innerText =
            "Errore durante la lettura del documento.";

    }

}


/* =========================
   SALVA FOTO
========================= */

function salvaFotoSulTelefono(file) {

    try {

        const url =
            URL.createObjectURL(file);

        const link =
            document.createElement("a");

        link.href = url;

        link.download =
            "documento_" +
            new Date().getTime() +
            ".jpg";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        setTimeout(function() {

            URL.revokeObjectURL(url);

        }, 3000);

    } catch (errore) {

        console.log(
            "Salvataggio foto non disponibile",
            errore
        );

    }

}


/* =========================
   ESTRAZIONE DATI OCR
========================= */

function estraiDatiDocumento(testo) {

    const righe =
        testo
        .toUpperCase()
        .split(/\r?\n/)
        .map(r => r.trim())
        .filter(r => r.length > 0);


    let cognome = "";
    let nome = "";
    let documento = "";


    /*
       Cerchiamo il cognome.
    */

    for (let i = 0; i < righe.length; i++) {

        if (
            righe[i].includes("COGNOME") ||
            righe[i].includes("SURNAME")
        ) {

            if (righe[i + 1]) {

                const valore =
                    pulisciNome(
                        righe[i + 1]
                    );

                if (valore.length > 1) {

                    cognome = valore;
                    break;

                }

            }

        }

    }


    /*
       Cerchiamo il nome.
    */

    for (let i = 0; i < righe.length; i++) {

        if (
            righe[i].includes("NOME") ||
            righe[i].includes("NAME")
        ) {

            if (righe[i + 1]) {

                const valore =
                    pulisciNome(
                        righe[i + 1]
                    );

                if (valore.length > 1) {

                    nome = valore;
                    break;

                }

            }

        }

    }


    /*
       Cerchiamo un codice compatibile
       con il numero della CIE.
    */

    const testoPulito =
        testo
        .toUpperCase()
        .replace(/\s+/g, " ");


    const codici =
        testoPulito.match(
            /\b[A-Z]{2}\d{5,8}[A-Z0-9]?\b/g
        );


    if (codici && codici.length > 0) {

        documento = codici[0];

    }


    /*
       Seconda ricerca più permissiva.
    */

    if (!documento) {

        const possibile =
            testoPulito.match(
                /\b[A-Z0-9]{7,12}\b/g
            );

        if (possibile) {

            for (const codice of possibile) {

                if (
                    /\d/.test(codice) &&
                    /[A-Z]/.test(codice)
                ) {

                    documento = codice;
                    break;

                }

            }

        }

    }


    /*
       Inserimento nei campi.
    */

    if (cognome) {

        document.getElementById(
            "cognome"
        ).value = cognome;

    }


    if (nome) {

        document.getElementById(
            "nome"
        ).value = nome;

    }


    if (documento) {

        document.getElementById(
            "documento"
        ).value = documento;

    }


    if (
        !cognome &&
        !nome &&
        !documento
    ) {

        alert(
            "OCR completato, ma non sono riuscito a riconoscere automaticamente i dati. Puoi inserirli manualmente."
        );

    }

}


/* =========================
   PULIZIA NOMI
========================= */

function pulisciNome(valore) {

    return valore
        .replace(/[^A-ZÀ-Ú' -]/gi, "")
        .trim();

}


/* =========================
   DATI OSPITI
========================= */

function caricaOspiti() {

    try {

        return JSON.parse(
            localStorage.getItem(CHIAVE)
        ) || [];

    } catch (errore) {

        return [];

    }

}


function salvaOspiti(ospiti) {

    localStorage.setItem(
        CHIAVE,
        JSON.stringify(ospiti)
    );

}


/* =========================
   SALVA OSPITE
========================= */

function salvaOspite() {

    const cognome =
        document.getElementById("cognome").value.trim();

    const nome =
        document.getElementById("nome").value.trim();

    const documento =
        document.getElementById("documento").value.trim();

    const arrivo =
        document.getElementById("arrivo").value;

    const partenza =
        document.getElementById("partenza").value;

    const tipoDocumento =
        document.getElementById("tipoDocumento").value;

    const nazionalita =
        document.getElementById("nazionalita").value;


    if (!cognome || !nome) {

        alert(
            "Inserisci almeno Cognome e Nome."
        );

        return;

    }


    const ospiti =
        caricaOspiti();


    ospiti.push({

        id: Date.now(),

        cognome: cognome,

        nome: nome,

        documento: documento,

        arrivo: arrivo,

        partenza: partenza,

        tipoDocumento: tipoDocumento,

        nazionalita: nazionalita,

        dataInserimento:
            new Date().toISOString()

    });


    salvaOspiti(ospiti);

    mostraOspiti();

    pulisciForm();


    alert(
        "Ospite salvato correttamente."
    );

}


/* =========================
   MOSTRA OSPITI
========================= */

function mostraOspiti() {

    const lista =
        document.getElementById("lista");

    const ospiti =
        caricaOspiti();


    if (!ospiti.length) {

        lista.innerHTML =
            "<p>Nessun ospite registrato.</p>";

        return;

    }


    lista.innerHTML = "";


    ospiti.forEach(function(ospite) {

        const div =
            document.createElement("div");

        div.className = "ospite";


        div.innerHTML = `

            <b>
                ${escapeHtml(ospite.cognome)}
                ${escapeHtml(ospite.nome)}
            </b>

            <br>

            Documento:
            ${escapeHtml(ospite.documento || "-")}

            <br>

            Arrivo:
            ${escapeHtml(ospite.arrivo || "-")}

            <br>

            Partenza:
            ${escapeHtml(ospite.partenza || "-")}

            <br>

            <button
                class="red"
                onclick="eliminaOspite(${ospite.id})"
            >
                Elimina
            </button>

        `;


        lista.appendChild(div);

    });

}


/* =========================
   ELIMINA OSPITE
========================= */

function eliminaOspite(id) {

    if (
        !confirm(
            "Vuoi eliminare questo ospite?"
        )
    ) {

        return;

    }


    let ospiti =
        caricaOspiti();


    ospiti =
        ospiti.filter(
            ospite =>
                ospite.id !== id
        );


    salvaOspiti(ospiti);

    mostraOspiti();

}


/* =========================
   PULISCI FORM
========================= */

function pulisciForm() {

    document.getElementById(
        "cognome"
    ).value = "";

    document.getElementById(
        "nome"
    ).value = "";

    document.getElementById(
        "documento"
    ).value = "";

    document.getElementById(
        "partenza"
    ).value = "";

    document.getElementById(
        "tipoDocumento"
    ).value = "";

    document.getElementById(
        "nazionalita"
    ).value = "";

    document.getElementById(
        "foto"
    ).value = "";

    document.getElementById(
        "anteprima"
    ).style.display = "none";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(testo) {

    return String(testo || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   DOWNLOAD FILE
========================= */

function scaricaFile(
    contenuto,
    nome,
    tipo
) {

    const blob =
        new Blob(
            [contenuto],
            { type: tipo }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download = nome;

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    setTimeout(function() {

        URL.revokeObjectURL(url);

    }, 1000);

}


/* =========================
   ALLOGGIATI WEB
========================= */

function esportaAlloggiati() {

    const ospiti =
        caricaOspiti();


    if (!ospiti.length) {

        alert(
            "Non ci sono ospiti da esportare."
        );

        return;

    }


    let testo = "";


    ospiti.forEach(function(o) {

        testo +=
            [
                o.cognome,
                o.nome,
                o.documento,
                o.arrivo,
                o.partenza
            ]
            .join(";") +
            "\r\n";

    });


    scaricaFile(
        testo,
        "alloggiati_web.txt",
        "text/plain;charset=utf-8"
    );

}


/* =========================
   SPOT
========================= */

function esportaSPOT() {

    const ospiti =
        caricaOspiti();


    if (!ospiti.length) {

        alert(
            "Non ci sono ospiti da esportare."
        );

        return;

    }


    let xml =
        '<?xml version="1.0" encoding="UTF-8"?>';

    xml +=
        "<ospiti>";


    ospiti.forEach(function(o) {

        xml += "<ospite>";

        xml +=
            "<cognome>" +
            escapeXml(o.cognome) +
            "</cognome>";

        xml +=
            "<nome>" +
            escapeXml(o.nome) +
            "</nome>";

        xml +=
            "<documento>" +
            escapeXml(o.documento) +
            "</documento>";

        xml +=
            "<arrivo>" +
            escapeXml(o.arrivo) +
            "</arrivo>";

        xml +=
            "<partenza>" +
            escapeXml(o.partenza) +
            "</partenza>";

        xml += "</ospite>";

    });


    xml +=
        "</ospiti>";


    scaricaFile(
        xml,
        "spot_puglia.xml",
        "application/xml;charset=utf-8"
    );

}


/* =========================
   TASSA DI SOGGIORNO
========================= */

function esportaTassa() {

    const ospiti =
        caricaOspiti();


    if (!ospiti.length) {

        alert(
            "Non ci sono ospiti da esportare."
        );

        return;

    }


    let csv =
        "Cognome;Nome;Documento;Arrivo;Partenza\n";


    ospiti.forEach(function(o) {

        csv +=
            [
                o.cognome,
                o.nome,
                o.documento,
                o.arrivo,
                o.partenza
            ]
            .join(";") +
            "\n";

    });


    scaricaFile(
        csv,
        "tassa_soggiorno_taranto.csv",
        "text/csv;charset=utf-8"
    );

}


/* =========================
   XML ESCAPE
========================= */

function escapeXml(testo) {

    return String(testo || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&apos;");

}

</script>

</body>
</html>
