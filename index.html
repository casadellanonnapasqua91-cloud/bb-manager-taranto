<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f80ed">
<title>B&B Manager Taranto</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#222;
}

header{
  background:#2f80ed;
  color:white;
  padding:28px 18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:30px;
}

main{
  padding:16px;
  max-width:750px;
  margin:auto;
}

.card{
  background:white;
  padding:16px;
  margin:12px 0;
  border-radius:14px;
  box-shadow:0 2px 8px #0001;
}

h2{
  margin-top:0;
}

input,select,button{
  width:100%;
  padding:14px;
  margin:6px 0;
  border-radius:9px;
  font-size:16px;
  border:1px solid #ccc;
}

button{
  background:#2f80ed;
  color:white;
  border:0;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.99);
}

button.secondary{
  background:#555;
}

button.green{
  background:#159957;
}

button.orange{
  background:#e67e22;
}

#foto{
  display:none;
}

#anteprima{
  width:100%;
  max-height:500px;
  object-fit:contain;
  margin-top:10px;
  border-radius:10px;
  display:none;
}

#statoOCR{
  display:none;
  margin-top:10px;
  padding:12px;
  border-radius:9px;
  background:#eef4ff;
}

#lista{
  margin-top:10px;
}

.ospite{
  padding:12px;
  border-bottom:1px solid #ddd;
}

.piccolo{
  font-size:13px;
  color:#666;
}

.errore{
  background:#ffecec;
  color:#a00;
  padding:10px;
  border-radius:8px;
  margin-top:8px;
}
</style>
</head>

<body>

<header>
  <h1>B&B Manager Taranto</h1>
  <div>Gestione ospiti</div>
</header>

<main>

<div class="card">

<h2>Nuovo ospite</h2>

<input id="cognome" type="text" placeholder="Cognome">
<input id="nome" type="text" placeholder="Nome">
<input id="documento" type="text" placeholder="Numero documento">

<select id="arrivo">
  <option value="">Tipo documento</option>
  <option value="Carta d'identità">Carta d'identità</option>
  <option value="Passaporto">Passaporto</option>
  <option value="Patente">Patente</option>
</select>

<select id="paese">
  <option value="">Paese / cittadinanza</option>
  <option value="ITA">Italia</option>
  <option value="AUT">Austria</option>
  <option value="BEL">Belgio</option>
  <option value="FRA">Francia</option>
  <option value="DEU">Germania</option>
  <option value="GBR">Regno Unito</option>
  <option value="ESP">Spagna</option>
  <option value="USA">Stati Uniti</option>
  <option value="Altro">Altro</option>
</select>

<button class="green" onclick="salvaOspite()">
  Salva ospite
</button>

<button onclick="document.getElementById('foto').click()">
  📷 Foto documento
</button>

<input
  id="foto"
  type="file"
  accept="image/*"
  capture="environment"
  onchange="gestisciFoto(event)"
>

<img id="anteprima">

<div id="statoOCR"></div>

</div>


<div class="card">

<h2>Esportazioni</h2>

<button onclick="esportaAlloggiati()">
  TXT Alloggiati Web
</button>

<button onclick="esportaSPOT()">
  XML SPOT Puglia
</button>

<button onclick="esportaTaranto()">
  CSV Tassa di soggiorno Taranto
</button>

</div>


<div class="card">

<h2>Ospiti registrati</h2>

<div id="lista"></div>

</div>

</main>


<script>

const CHIAVE = "bb_manager_taranto_ospiti";


function getOspiti(){
  try{
    return JSON.parse(localStorage.getItem(CHIAVE) || "[]");
  }catch(e){
    return [];
  }
}


function setOspiti(lista){
  localStorage.setItem(CHIAVE, JSON.stringify(lista));
}


function mostraOspiti(){

  const lista = getOspiti();
  const box = document.getElementById("lista");

  if(!lista.length){
    box.innerHTML = "<p>Nessun ospite.</p>";
    return;
  }

  box.innerHTML = lista.map((x,i)=>`
    <div class="ospite">
      <b>${escapeHtml(x.cognome)} ${escapeHtml(x.nome)}</b><br>
      Documento: ${escapeHtml(x.documento)}<br>
      Tipo: ${escapeHtml(x.tipo)}<br>
      Cittadinanza: ${escapeHtml(x.paese)}
      <div class="piccolo">
        Arrivo: ${escapeHtml(x.data)}
      </div>
      <button class="secondary" onclick="eliminaOspite(${i})">
        Elimina
      </button>
    </div>
  `).join("");
}


function escapeHtml(v){
  return String(v || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}


function salvaOspite(){

  const cognome = document.getElementById("cognome").value.trim();
  const nome = document.getElementById("nome").value.trim();
  const documento = document.getElementById("documento").value.trim();
  const tipo = document.getElementById("arrivo").value;
  const paese = document.getElementById("paese").value;

  if(!cognome || !nome || !documento){
    alert("Inserisci Cognome, Nome e Numero documento.");
    return;
  }

  const lista = getOspiti();

  lista.push({
    cognome,
    nome,
    documento,
    tipo,
    paese,
    data:new Date().toISOString().slice(0,10)
  });

  setOspiti(lista);

  mostraOspiti();

  document.getElementById("cognome").value="";
  document.getElementById("nome").value="";
  document.getElementById("documento").value="";
  document.getElementById("arrivo").value="";
  document.getElementById("paese").value="";

  alert("Ospite salvato.");
}


function eliminaOspite(i){

  if(!confirm("Vuoi eliminare questo ospite?")){
    return;
  }

  const lista = getOspiti();
  lista.splice(i,1);
  setOspiti(lista);
  mostraOspiti();
}


/* ============================
   FOTO + OCR
============================ */

async function gestisciFoto(event){

  const file = event.target.files[0];

  if(!file){
    return;
  }

  const anteprima = document.getElementById("anteprima");
  const stato = document.getElementById("statoOCR");

  const url = URL.createObjectURL(file);

  anteprima.src = url;
  anteprima.style.display = "block";

  stato.style.display = "block";
  stato.innerHTML = "📷 Foto acquisita.<br>🔎 Lettura del documento in corso...";

  try{

    /*
      Il browser riceve la foto dalla fotocamera.
      La visualizziamo anche nell'app.
    */

    const risultato = await Tesseract.recognize(
      file,
      "ita+eng",
      {
        logger: function(m){

          if(m.status === "recognizing text"){
            const percentuale = Math.round((m.progress || 0) * 100);

            stato.innerHTML =
              "🔎 Lettura documento: " +
              percentuale +
              "%";
          }

        }
      }
    );

    const testo = risultato.data.text || "";

    console.log("TESTO OCR:", testo);

    estraiDatiDocumento(testo);

  }catch(err){

    console.error(err);

    stato.innerHTML =
      '<div class="errore">' +
      'OCR non riuscito. Puoi comunque compilare i dati manualmente.' +
      '</div>';
  }
}


/* ============================
   ESTRAZIONE DATI CIE
============================ */

function estraiDatiDocumento(testo){

  const stato = document.getElementById("statoOCR");

  let pulito = testo
    .replace(/\r/g,"\n")
    .replace(/[|]/g,"I");

  const righe = pulito
    .split("\n")
    .map(x=>x.trim())
    .filter(x=>x.length>0);


  /*
    Numero CIE:
    normalmente è composto da 2 lettere,
    5 numeri e 2 lettere.
    Esempio:
    CA07404HJ
  */

  const regexDocumento =
    /\b[A-Z]{2}[0-9]{5}[A-Z]{2}\b/i;

  let documento = pulito.match(regexDocumento);

  if(documento){

    document.getElementById("documento").value =
      documento[0].toUpperCase();

  }else{

    /*
      Secondo tentativo:
      cerchiamo stringhe alfanumeriche simili
    */

    const candidati = pulito.match(
      /\b[A-Z]{1,3}[0-9]{4,7}[A-Z]{1,3}\b/gi
    );

    if(candidati && candidati.length){

      document.getElementById("documento").value =
        candidati[0].toUpperCase();
    }
  }


  /*
    Cerchiamo le parole chiave della CIE.
  */

  let indiceCognome = -1;
  let indiceNome = -1;

  for(let i=0;i<righe.length;i++){

    const r = righe[i].toUpperCase();

    if(
      r.includes("COGNOME") ||
      r.includes("SURNAME")
    ){
      indiceCognome = i;
    }

    if(
      r.includes("NOME") ||
      r.includes("GIVEN")
    ){
      indiceNome = i;
    }
  }


  /*
    Estrazione cognome
  */

  let cognome = "";

  if(indiceCognome >= 0){

    const stessaRiga =
      pulisciValore(righe[indiceCognome]);

    if(stessaRiga){
      cognome = stessaRiga;
    }else{

      for(
        let i=indiceCognome+1;
        i<Math.min(righe.length,indiceCognome+4);
        i++
      ){

        const v = pulisciValore(righe[i]);

        if(v && !contieneParolaTecnica(v)){
          cognome = v;
          break;
        }
      }
    }
  }


  /*
    Estrazione nome
  */

  let nome = "";

  if(indiceNome >= 0){

    const stessaRiga =
      pulisciValore(righe[indiceNome]);

    if(stessaRiga){
      nome = stessaRiga;
    }else{

      for(
        let i=indiceNome+1;
        i<Math.min(righe.length,indiceNome+4);
        i++
      ){

        const v = pulisciValore(righe[i]);

        if(v && !contieneParolaTecnica(v)){
          nome = v;
          break;
        }
      }
    }
  }


  /*
    Se l'OCR legge male le etichette,
    cerchiamo alcune strutture tipiche della CIE.
  */

  if(!cognome || !nome){

    const parole = pulito
      .split(/\s+/)
      .map(x=>x.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ']/g,""))
      .filter(x=>x.length>=2);

    /*
      Cerchiamo "COGNOME / SURNAME"
      e prendiamo una parola successiva.
    */

    for(let i=0;i<parole.length;i++){

      const p = parole[i].toUpperCase();

      if(
        !cognome &&
        (p.includes("COGNOM") || p==="SURNAME")
      ){

        if(parole[i+1]){
          cognome = parole[i+1];
        }
      }

      if(
        !nome &&
        (p==="NOME" || p==="NAME")
      ){

        if(parole[i+1]){
          nome = parole[i+1];
        }
      }
    }
  }


  /*
    Pulizia finale.
  */

  cognome = pulisciPersona(cognome);
  nome = pulisciPersona(nome);


  if(cognome){
    document.getElementById("cognome").value = cognome;
  }

  if(nome){
    document.getElementById("nome").value = nome;
  }


  document.getElementById("arrivo").value =
    "Carta d'identità";

  document.getElementById("paese").value =
    "ITA";


  if(
    document.getElementById("cognome").value &&
    document.getElementById("nome").value &&
    document.getElementById("documento").value
  ){

    stato.innerHTML =
      "✅ Documento letto.<br>" +
      "Cognome, Nome e Numero documento compilati automaticamente.";

  }else{

    stato.innerHTML =
      "⚠️ Foto acquisita e OCR terminato.<br>" +
      "Alcuni dati non sono stati riconosciuti: controllali e completali manualmente.";
  }

}


function pulisciValore(v){

  if(!v){
    return "";
  }

  v = v
    .replace(/COGNOME/ig,"")
    .replace(/SURNAME/ig,"")
    .replace(/NOME/ig,"")
    .replace(/NAME/ig,"")
    .replace(/COGNOM/ig,"")
    .replace(/GIVEN/ig,"")
    .replace(/[:\-]/g," ")
    .trim();

  return v;
}


function pulisciPersona(v){

  if(!v){
    return "";
  }

  v = v
    .replace(/[^A-Za-zÀ-ÖØ-öø-ÿ' ]/g," ")
    .replace(/\s+/g," ")
    .trim();

  return v;
}


function contieneParolaTecnica(v){

  const x = v.toUpperCase();

  return [
    "ITALIA",
    "ITALIAN",
    "REPUBBLICA",
    "MINISTERO",
    "INTERNO",
    "IDENTITY",
    "CARD",
    "CARTA",
    "COMUNE",
    "NATIONALITY",
    "CITTADINANZA",
    "SESSO",
    "SEX",
    "EMISSIONE",
    "SCADENZA",
    "VALID",
    "FIRMA"
  ].some(p=>x.includes(p));
}


/* ============================
   DOWNLOAD FILE
============================ */

function scarica(nome, contenuto, tipo){

  const blob = new Blob(
    [contenuto],
    {type:tipo}
  );

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;
  a.download = nome;

  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);
}


/* ============================
   ALLOGGIATI WEB
============================ */

function esportaAlloggiati(){

  const lista = getOspiti();

  if(!lista.length){
    alert("Nessun ospite registrato.");
    return;
  }

  /*
    Questo file contiene i dati disponibili.
    Il formato definitivo Alloggiati Web
    deve rispettare la specifica prevista dal portale.
  */

  const righe = lista.map(x=>[
    x.cognome,
    x.nome,
    x.documento,
    x.tipo,
    x.paese,
    x.data
  ].join(";"));

  scarica(
    "alloggiati_web.txt",
    righe.join("\n"),
    "text/plain;charset=utf-8"
  );
}


/* ============================
   SPOT PUGLIA
============================ */

function esportaSPOT(){

  const lista = getOspiti();

  if(!lista.length){
    alert("Nessun ospite registrato.");
    return;
  }

  const xml =
`<?xml version="1.0" encoding="UTF-8"?>
<ospiti>
${lista.map(x=>`
  <ospite>
    <cognome>${xmlEscape(x.cognome)}</cognome>
    <nome>${xmlEscape(x.nome)}</nome>
    <documento>${xmlEscape(x.documento)}</documento>
    <tipoDocumento>${xmlEscape(x.tipo)}</tipoDocumento>
    <cittadinanza>${xmlEscape(x.paese)}</cittadinanza>
    <arrivo>${xmlEscape(x.data)}</arrivo>
  </ospite>`).join("")}
</ospiti>`;

  scarica(
    "spot_puglia.xml",
    xml,
    "application/xml;charset=utf-8"
  );
}


/* ============================
   TASSA DI SOGGIORNO
============================ */

function esportaTaranto(){

  const lista = getOspiti();

  if(!lista.length){
    alert("Nessun ospite registrato.");
    return;
  }

  const intestazione =
    "Cognome;Nome;Documento;Arrivo;Partenza\n";

  const righe = lista.map(x=>[
    x.cognome,
    x.nome,
    x.documento,
    x.data,
    ""
  ].join(";"));

  scarica(
    "tassa_soggiorno_taranto.csv",
    intestazione + righe.join("\n"),
    "text/csv;charset=utf-8"
  );
}


function xmlEscape(v){

  return String(v || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&apos;");
}


/* Avvio */

mostraOspiti();

</script>

</body>
</html>
